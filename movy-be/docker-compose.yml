version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: movy_postgres
    restart: always
    environment:
      POSTGRES_USER: movy_user
      POSTGRES_PASSWORD: movy_pass
      POSTGRES_DB: movy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: movy_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movy_api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movy
      SPRING_DATASOURCE_USERNAME: movy_user
      SPRING_DATASOURCE_PASSWORD: movy_pass
      SPRING_RABBITMQ_HOST: rabbitmq

volumes:
  pgdata:
