spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/movy
    username: movy_user
    password: movy_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    outOfOrder: true
    locations: classpath:db.migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

rabbitmq:
  host: rabbitmq
  port: 5672
