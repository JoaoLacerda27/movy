spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/movy
    username: movy_user
    password: movy_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

rabbitmq:
  host: localhost
  port: 5672
